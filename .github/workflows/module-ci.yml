name: Danmu Fusion checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/build-danmu-fusion.mjs --check
      - run: npm run test:all
      - run: npm run test:forward-native
      - run: npm run test:forward-multi
